[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-team"
dynamic = ["version"]
description = "A multi-agent AI software development team."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "pytest>=8.0.0",
    "ddgs>=9.0.0",
]

[project.scripts]
team = "team_cli:main"

[tool.setuptools]
packages = ["agents"]
py-modules = [
    "context_manager",
    "file_utils",
    "llm_client",
    "model_router",
    "orchestrator",
    "team_cli",
    "team_config",
    "team_config_cli",
    "team_dashboard",
    "team_doctor",
    "team_events",
    "team_history",
    "team_replay",
    "team_version",
    "usage_tracker",
    "web_search",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
