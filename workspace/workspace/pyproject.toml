[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world"
version = "0.1.0"
description = "A simple Hello World project with pytest tests."
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Declare the hello module so it gets installed
py_modules = ["hello"]

[project.scripts]
hello-world = "hello:main"

[project.optional-dependencies]
dev = ["pytest>=7.0,<9"]
